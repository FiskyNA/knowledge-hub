version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: knowledge_hub
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: knowledge-hub-server
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:secret@postgres:5432/knowledge_hub?schema=public"
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: knowledge-hub-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pg_data:
